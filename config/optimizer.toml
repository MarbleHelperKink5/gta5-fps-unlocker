# GtaV-Optimizer default configuration
# Update offsets after each GTA V title update.

[offsets]
fps_limiter        = 0x1412A4F80
stutter_threshold  = 0x1412A5B10
shader_cache_size  = 0x1412A6100

[modules]
fps_unlock    = true
stutter_fix   = true
shader_boost  = true

[injector]
auto_attach   = true
overlay       = true

[logging]
level         = "info"
file          = "gta5-fps-unlocker.log"